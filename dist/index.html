<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDPro - 离线版</title>

<!-- ====== CDN 依赖（固定版本号）====== -->
<script src="lib/d3.min.js"></script>
<script src="lib/markmap-lib.min.js"></script>
<script src="lib/markmap-view.min.js"></script>
<script src="lib/marked.min.js"></script>

<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f6f8;
  --bg-tertiary: #f0f0f0;
  --text-primary: #333333;
  --text-secondary: #555555;
  --text-muted: #888888;
  --text-light: #999999;
  --border: #e0e0e0;
  --border-light: #e8e8e8;
  --accent: #1976d2;
  --accent-hover: #1565c0;
  --accent-light: #e3f2fd;
  --accent-border: #90caf9;
  --danger: #d32f2f;
  --danger-bg: #fff5f5;
  --danger-border: #ffc9c9;
  --danger-hover: #ffebee;
  --success: #2e7d32;
  --warning: #f57c00;
  --shadow: rgba(0,0,0,0.12);
  --code-bg: #f0f2f5;
  --code-color: #d63384;
  --pre-bg: #f6f8fa;
  --pre-border: #e8e8e8;
  --panel-shadow: rgba(0,0,0,0.06);
  --popup-bg: #ffffff;
  --popup-border: #cccccc;
  --editable-bg: #ffffff;
}
body.dark {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --text-primary: #e0e0e0;
  --text-secondary: #b0b0b0;
  --text-muted: #8899aa;
  --text-light: #666666;
  --border: #2a2a3e;
  --border-light: #333348;
  --accent: #64b5f6;
  --accent-hover: #42a5f5;
  --accent-light: #1a237e;
  --accent-border: #1565c0;
  --danger: #ef5350;
  --danger-bg: #2a1111;
  --danger-border: #5a2020;
  --danger-hover: #331122;
  --success: #66bb6a;
  --warning: #ffa726;
  --shadow: rgba(0,0,0,0.4);
  --code-bg: #2d2d3d;
  --code-color: #f48fb1;
  --pre-bg: #1e1e2e;
  --pre-border: #333348;
  --panel-shadow: rgba(0,0,0,0.3);
  --popup-bg: #1a1a2e;
  --popup-border: #444458;
  --editable-bg: #2a2a3e;
}
body.dark .welcome-icon { opacity:0.5; }
body.dark .markmap-node .markmap-foreign > div[contenteditable]:focus { background:var(--editable-bg); }
body.dark .doc-content code { background:var(--code-bg); color:var(--code-color); }
body.dark .doc-content pre { background:var(--pre-bg); border-color:var(--pre-border); }
body.dark .doc-content pre code { color:var(--text-primary); }
body.dark .doc-content blockquote { background:var(--bg-secondary); color:var(--text-secondary); }
body.dark .doc-content th { background:var(--bg-tertiary); }
body.dark .doc-content tr:nth-child(even) { background:var(--bg-secondary); }
body.dark .doc-content hr { border-top-color:var(--border); }
body.dark .error-box { background:var(--danger-bg); border-color:var(--danger-border); }
body.dark .retry-btn { background:var(--danger); }
body.dark .retry-btn:hover { background:#c62828; }
body.dark .markmap-node[data-active="true"] foreignObject > div,
body.dark .markmap-node[data-active="true"] .markmap-foreign > div { color:#ef5350 !important; }
body.dark .doc-content blockquote { border-left-color:var(--accent); }
body.dark .doc-content a { color:var(--accent); }
body.dark #search-input { background:var(--bg-tertiary); color:var(--text-primary); border-color:var(--border); }
body.dark .drag-indicator { background:var(--accent); }
body.dark .markmap-node.drag-over > foreignObject { outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px; }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; color:var(--text-primary); background:var(--bg-primary); font-size:14px; }

#app { display:flex; height:100vh; overflow:hidden; }

#left-panel {
  width:60%; display:flex; flex-direction:column;
  background:var(--bg-secondary); border-right:1px solid var(--border-light);
  flex-shrink:0; min-width:200px;
}

#menubar {
  display:flex; align-items:stretch; height:34px;
  background:var(--bg-tertiary); border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.menu-trigger {
  position:relative; padding:0 14px;
  display:flex; align-items:center; cursor:pointer;
  font-size:13px; user-select:none; letter-spacing:0.3px;
  color:var(--text-primary);
}
.menu-trigger:hover, .menu-trigger.open { background:var(--border); }
.menu-trigger.open { background:var(--text-muted); }
.menu-popup {
  display:none; position:absolute; top:100%; left:0; z-index:2000;
  background:var(--popup-bg); border:1px solid var(--popup-border); border-radius:4px;
  box-shadow:0 2px 12px var(--shadow); min-width:175px; padding:4px 0;
}
.menu-popup.open { display:block; }
.menu-option {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 14px; font-size:13px; cursor:pointer; color:var(--text-primary);
}
.menu-option:hover { background:var(--accent); color:#fff; }
.menu-option:hover .menu-shortcut { color:#bbdefb; }
.menu-shortcut { color:var(--text-light); font-size:11px; margin-left:20px; }
.menu-divider { height:1px; background:var(--border-light); margin:4px 8px; }

#toolbar {
  display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  padding:4px 8px; border-bottom:1px solid var(--border); flex-shrink:0;
  background:var(--bg-tertiary);
}
.tool-btn {
  padding:4px 10px; font-size:12px; border:1px solid var(--border);
  background:var(--bg-primary); border-radius:3px; cursor:pointer;
  transition:all 0.15s; white-space:nowrap; color:var(--text-primary);
}
.tool-btn:hover { background:var(--accent-light); border-color:var(--accent-border); }
.tool-btn:active { background:var(--accent-border); }
.tool-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.tool-btn.active:hover { background:var(--accent-hover); }
.tool-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

#search-bar {
  display:flex; align-items:center; gap:4px;
  padding:2px 4px; border-bottom:1px solid var(--border); flex-shrink:0;
  background:var(--bg-tertiary);
}
#search-bar.hidden { display:none; }
#search-input {
  flex:1; padding:3px 8px; font-size:12px; border:1px solid var(--border);
  border-radius:3px; outline:none; background:var(--bg-primary);
  color:var(--text-primary); min-width:0;
}
#search-input:focus { border-color:var(--accent); }
#search-count { font-size:11px; color:var(--text-light); white-space:nowrap; padding:0 4px; }
#search-close {
  padding:2px 6px; font-size:11px; border:none; background:transparent;
  cursor:pointer; color:var(--text-light); border-radius:3px;
}
#search-close:hover { background:var(--border); color:var(--text-primary); }
.markmap-node.search-match > foreignObject { outline:2px dashed var(--accent); outline-offset:-2px; border-radius:4px; }
.markmap-node.search-current > foreignObject { outline:3px solid var(--accent); outline-offset:-3px; border-radius:4px; }

/* --- 思维导图区域 --- */
#mindmap-panel { flex:1; overflow:hidden; position:relative; }
#mindmap-panel svg { width:100%; height:100%; display:block; }
#ctx-trigger {
  position:fixed; z-index:5000; display:none;
  width:28px; height:28px; border-radius:50%;
  background:var(--accent); color:#fff; border:2px solid #fff;
  font-size:16px; line-height:28px; text-align:center;
  cursor:pointer; box-shadow:0 2px 8px var(--shadow);
  user-select:none;
}
#ctx-trigger:hover { transform:scale(1.15); }
#ctx-trigger.show { display:block !important; }
#context-menu {
  position:fixed; z-index:10000; min-width:160px;
  background:var(--popup-bg); border:1px solid var(--popup-border);
  border-radius:6px; box-shadow:0 4px 20px var(--shadow);
  padding:4px 0; display:none;
}
#context-menu .ctx-item {
  padding:7px 16px; font-size:13px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  color:var(--text-primary); transition:background 0.1s;
}
#context-menu .ctx-item:hover { background:var(--accent); color:#fff; }
#context-menu .ctx-item.danger:hover { background:var(--danger); color:#fff; }
#context-menu .ctx-divider { height:1px; background:var(--border); margin:4px 8px; }
#context-menu .ctx-item .arrow { margin-left:auto; font-size:10px; opacity:0.5; }
#context-menu .ctx-sub {
  display:none; position:absolute; left:100%; top:-4px;
  min-width:180px; max-height:300px; overflow-y:auto;
  background:var(--popup-bg); border:1px solid var(--popup-border);
  border-radius:6px; box-shadow:0 4px 20px var(--shadow);
  padding:4px 0;
}
#context-menu .ctx-item.has-sub:hover > .ctx-sub { display:block; }

#splitter {
  width:6px; cursor:col-resize; flex-shrink:0;
  background:var(--border); position:relative; z-index:10;
  transition:background 0.15s;
}
#splitter:hover, #splitter.active { background:var(--accent); }

#doc-panel {
  flex:1; display:flex; flex-direction:column;
  background:var(--bg-primary); box-shadow:-2px 0 12px var(--panel-shadow);
  min-width:200px;
}
#doc-header {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:12px 24px; border-bottom:1px solid var(--border-light);
  background:var(--bg-secondary); gap:12px;
}
#node-title { font-size:16px; font-weight:600; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#header-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.header-btn {
  padding:5px 14px; font-size:12px; border:1px solid var(--popup-border);
  background:var(--bg-primary); border-radius:4px; cursor:pointer; transition:all 0.15s;
  color:var(--text-primary);
}
.header-btn:hover { background:var(--accent-light); border-color:var(--accent-border); }
.header-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.header-btn.primary:hover { background:var(--accent-hover); }
.header-btn.danger { color:var(--danger); border-color:var(--danger-border); }
.header-btn.danger:hover { background:var(--danger-hover); }
#save-indicator { font-size:12px; color:var(--text-light); min-width:50px; text-align:right; }

#doc-body { flex:1; overflow-y:auto; padding:20px 24px 40px; }

#editor-area { display:flex; flex-direction:column; height:100%; }
#editor-toolbar {
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  padding:6px 8px; background:var(--bg-secondary); border:1px solid var(--border);
  border-bottom:none; border-radius:6px 6px 0 0; flex-shrink:0;
}
.ed-tb-btn {
  width:30px; height:28px; display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; border-radius:3px; cursor:pointer;
  font-size:13px; color:var(--text-secondary); transition:all 0.12s;
}
.ed-tb-btn:hover { background:var(--accent-light); color:var(--accent); }
.ed-tb-sep { width:1px; height:18px; background:var(--border); margin:0 4px; }
#editor-textarea {
  flex:1; width:100%; min-height:300px;
  padding:14px 16px; font-size:14px; line-height:1.7;
  font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  border:1px solid var(--border); border-top:none; border-radius:0 0 6px 6px; resize:vertical;
  outline:none; transition:border-color 0.2s; background:var(--bg-primary); color:var(--text-primary);
}
#editor-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(25,118,210,0.1); }

.welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-light); text-align:center; padding:40px; }
.welcome-icon { font-size:44px; margin-bottom:14px; opacity:0.35; }
.welcome h3 { font-size:17px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
.welcome p { font-size:13px; line-height:1.8; color:var(--text-light); max-width:340px; }

.doc-content h1 { font-size:24px; margin:0 0 14px; padding-bottom:8px; border-bottom:2px solid var(--accent); color:var(--text-primary); }
.doc-content h2 { font-size:19px; margin:22px 0 8px; color:var(--text-primary); }
.doc-content h3 { font-size:16px; margin:18px 0 6px; color:var(--text-primary); }
.doc-content h4 { font-size:14px; margin:14px 0 5px; color:var(--text-muted); }
.doc-content p { margin:8px 0; line-height:1.8; font-size:14px; color:var(--text-primary); }
.doc-content ul, .doc-content ol { margin:6px 0 6px 22px; line-height:1.8; font-size:14px; color:var(--text-primary); }
.doc-content li { margin:3px 0; }
.doc-content code {
  background:var(--code-bg); padding:1px 5px; border-radius:3px;
  font-size:13px; font-family:"SFMono-Regular",Consolas,monospace; color:var(--code-color);
}
.doc-content pre {
  background:var(--pre-bg); padding:12px 14px; border-radius:6px;
  overflow-x:auto; margin:10px 0; border:1px solid var(--pre-border);
}
.doc-content pre code { background:none; padding:0; color:var(--text-primary); font-size:13px; }
.doc-content blockquote {
  border-left:4px solid var(--accent); padding:6px 14px;
  margin:10px 0; background:var(--bg-secondary); color:var(--text-secondary); font-style:italic;
}
.doc-content table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
.doc-content th,.doc-content td { border:1px solid var(--border); padding:6px 10px; text-align:left; color:var(--text-primary); }
.doc-content th { background:var(--bg-tertiary); font-weight:600; }
.doc-content tr:nth-child(even) { background:var(--bg-secondary); }
.doc-content a { color:var(--accent); text-decoration:none; }
.doc-content a:hover { text-decoration:underline; }
.doc-content strong { font-weight:700; }
.doc-content hr { border:none; border-top:1px solid var(--border-light); margin:18px 0; }

.loading-container { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { margin-top:12px; font-size:14px; color:var(--text-light); }

.error-container { padding:40px 20px; text-align:center; }
.error-box { background:var(--danger-bg); border:1px solid var(--danger-border); border-radius:8px; padding:20px; max-width:400px; margin:0 auto; }
.error-title { font-size:15px; color:var(--danger); font-weight:600; margin-bottom:6px; }
.error-detail { font-size:13px; color:var(--text-light); margin-bottom:14px; word-break:break-all; line-height:1.5; }
.retry-btn { background:var(--danger); color:#fff; border:none; padding:7px 22px; border-radius:5px; font-size:13px; cursor:pointer; transition:background 0.2s; }
.retry-btn:hover { filter:brightness(1.15); }

.no-doc { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--text-light); }
.no-doc-text { font-size:14px; }

.markmap-node[data-active="true"] foreignObject > div,
.markmap-node[data-active="true"] .markmap-foreign > div { color:var(--danger) !important; }

.markmap-node .markmap-foreign > div[contenteditable]:focus {
  outline:2px solid var(--accent); outline-offset:1px;
  border-radius:2px; min-width:20px; background:var(--editable-bg);
}

#import-input, #open-file-input { display:none; }

@media (max-width:768px) {
  #app { flex-direction:column; }
  #left-panel { width:100% !important; height:50vh; border-right:none; border-bottom:1px solid var(--border-light); }
  #splitter { display:none; }
  #doc-panel { width:100% !important; height:50vh; }
  #doc-body { padding:14px 16px 30px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- 左侧面板 -->
  <div id="left-panel">
    <!-- 菜单栏（由 JS 动态生成） -->
    <div id="menubar"></div>
    <!-- 快捷工具栏 -->
    <div id="toolbar">
      <button class="tool-btn" data-action="save-file" data-i18n="saveBtn">Save</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" data-action="add-child" data-i18n="addChildBtn">+Child</button>
      <button class="tool-btn" data-action="add-sibling" data-i18n="addSiblingBtn">+Sibling</button>
      <button class="tool-btn" data-action="rename" data-i18n="renameBtn">Rename</button>
      <button class="tool-btn" data-action="delete" data-i18n="deleteBtn">Delete</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" data-action="expand-all" data-i18n="expandBtn">Expand</button>
      <button class="tool-btn" data-action="collapse-all" data-i18n="collapseBtn">Collapse</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" id="btn-search" title="Search">🔍</button>
      <button class="tool-btn" id="btn-dark-mode" title="Dark Mode">🌙</button>
      <button class="tool-btn" id="btn-lang" title="Language">EN</button>
    </div>
    <!-- 搜索栏 -->
    <div id="search-bar" class="hidden">
      <input id="search-input" type="text" placeholder="搜索节点..." data-i18n-placeholder="searchPlaceholder">
      <span id="search-count"></span>
      <button id="search-close">✕</button>
    </div>
    <!-- 思维导图 -->
    <div id="mindmap-panel">
      <svg id="mindmap"></svg>
    </div>
  </div>

  <!-- 可拖拽分隔条 -->
  <div id="splitter"></div>

  <!-- 右侧文档面板 -->
  <div id="doc-panel">
    <div id="doc-header">
      <span id="node-title" data-i18n="docView">文档查看</span>
      <div id="header-actions">
        <button class="header-btn" id="edit-toggle-btn" style="display:none">Edit</button>
        <span id="save-indicator"></span>
      </div>
    </div>
    <div id="doc-body">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#128196;</div>
        <h3 data-i18n="welcomeTitle">欢迎使用思维导图查看器</h3>
        <p data-i18n="welcomeDesc">点击左侧导图节点查看详情，或使用菜单/工具栏新建、修改、删除节点。所有更改自动保存到浏览器本地。</p>
      </div>
      <div class="doc-content" id="content-area" style="display:none"></div>
      <div id="editor-area" style="display:none">
        <div id="editor-toolbar">
          <button class="ed-tb-btn" title="Bold"    data-md="bold"><b>B</b></button>
          <button class="ed-tb-btn" title="Italic"  data-md="italic"><i>I</i></button>
          <button class="ed-tb-btn" title="Strikethrough" data-md="strike"><s>S</s></button>
          <span class="ed-tb-sep"></span>
          <button class="ed-tb-btn" title="Heading 1" data-md="h1">H1</button>
          <button class="ed-tb-btn" title="Heading 2" data-md="h2">H2</button>
          <button class="ed-tb-btn" title="Heading 3" data-md="h3">H3</button>
          <span class="ed-tb-sep"></span>
          <button class="ed-tb-btn" title="Unordered List" data-md="ul">&#8226;L</button>
          <button class="ed-tb-btn" title="Ordered List" data-md="ol">1.L</button>
          <span class="ed-tb-sep"></span>
          <button class="ed-tb-btn" title="Inline Code" data-md="code">&lt;/&gt;</button>
          <button class="ed-tb-btn" title="Blockquote" data-md="quote">&#10077;</button>
          <button class="ed-tb-btn" title="Link" data-md="link">&#128279;</button>
          <span class="ed-tb-sep"></span>
          <button class="ed-tb-btn" title="Horizontal Rule" data-md="hr">&#8212;</button>
        </div>
        <textarea id="editor-textarea" spellcheck="false"></textarea>
      </div>
      <div class="loading-container" id="loading-area" style="display:none">
        <div class="spinner"></div>
        <div class="loading-text">正在加载文档...</div>
      </div>
      <div class="error-container" id="error-area" style="display:none"></div>
      <div class="no-doc" id="no-doc-area" style="display:none">
        <div class="no-doc-text" data-i18n="noDoc">该节点暂无详细文档</div>
      </div>
    </div>
  </div>
</div>

<!-- 文件导入用隐藏 input -->
<input type="file" id="import-input" accept=".json">
<input type="file" id="open-file-input" accept=".mdpro,.json" style="display:none">

<!-- 右键菜单 -->
<div id="context-menu">
  <div class="ctx-item has-sub" id="ctx-move-to">
    <span data-i18n="moveTo">移到到...</span><span class="arrow">▶</span>
    <div class="ctx-sub" id="ctx-move-sub"></div>
  </div>
  <div class="ctx-item" id="ctx-move-up" data-i18n="moveUp">上移</div>
  <div class="ctx-item" id="ctx-move-down" data-i18n="moveDown">下移</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item danger" id="ctx-delete" data-i18n="deleteBtn">删除节点</div>
</div>
<!-- 节点操作触发按钮（选中节点时显示） -->
<div id="ctx-trigger" title="节点操作">⋮</div>

<script>
/* ============================================================
   1. 默认树形数据（集中定义，方便替换）
   ============================================================ */
const DEFAULT_TREE = {
  content: '项目策划',

function applyI18n() {

    el.textContent = t(el.dataset.i18n);

  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {

  dt.textContent = darkMode ? '☀️' : '🌙';

  var welcome = document.getElementById('welcome');
  if (welcome) {
    var h3 = welcome.querySelector('h3');
    var p = welcome.querySelector('p');
    if (h3) h3.textContent = t('welcomeTitle');
    if (p) p.textContent = t('welcomeDesc');
  }
  var noDocText = document.querySelector('#no-doc-area .no-doc-text');
  if (noDocText) noDocText.textContent = t('noDoc');
  var loadingText = document.querySelector('.loading-text');
  if (loadingText) loadingText.textContent = t('loading');
  var editToggle = document.getElementById('edit-toggle-btn');
  if (editToggle) {
    var isEditing = document.getElementById('editor-area').style.display !== 'none';

}

/* ---- 搜索 ---- */
var searchResults = [];
var searchCurrentIdx = -1;
function toggleSearch() {
  var bar = document.getElementById('search-bar');
  bar.classList.toggle('hidden');
  if (!bar.classList.contains('hidden')) {
    document.getElementById('search-input').focus();
  } else {
    clearSearch();
  }
}
function clearSearch() {
  searchResults = [];
  searchCurrentIdx = -1;
  document.getElementById('search-input').value = '';
  document.getElementById('search-count').textContent = '';
  document.querySelectorAll('.markmap-node.search-match').forEach(function(el) {
    el.classList.remove('search-match');
  });
  document.querySelectorAll('.markmap-node.search-current').forEach(function(el) {
    el.classList.remove('search-current');
  });
}
function doSearch(query) {
  clearSearch();
  if (!query || !query.trim()) return;
  query = query.trim().toLowerCase();
  /* 递归搜索树 */
  function walk(node) {
    if (node.content && node.content.toLowerCase().indexOf(query) !== -1) {
      searchResults.push(node.file);
    }
    if (node.children) node.children.forEach(walk);
  }
  walk(appData.treeData);
  /* 高亮匹配节点 */
  searchResults.forEach(function(file) {
    var el = findNodeElByFile(file);
    if (el) el.classList.add('search-match');
  });
  searchCurrentIdx = searchResults.length > 0 ? 0 : -1;
  updateSearchCount();
  if (searchCurrentIdx >= 0) focusSearchResult();
}
function focusSearchResult() {
  document.querySelectorAll('.markmap-node.search-current').forEach(function(el) {
    el.classList.remove('search-current');
  });
  if (searchCurrentIdx < 0 || searchCurrentIdx >= searchResults.length) return;
  var file = searchResults[searchCurrentIdx];
  var el = findNodeElByFile(file);
  if (el) {
    el.classList.add('search-current');
    /* 滚动到该节点 */
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch(_) {}
  }
  updateSearchCount();
}
function updateSearchCount() {
  var cnt = document.getElementById('search-count');
  if (searchResults.length === 0) {
    cnt.textContent = searchCurrentIdx < 0 ? '' : t('noResults');
  } else {
    cnt.textContent = (searchCurrentIdx + 1) + '/' + searchResults.length;
  }
}
function nextSearchResult() {
  if (searchResults.length === 0) return;
  searchCurrentIdx = (searchCurrentIdx + 1) % searchResults.length;
  focusSearchResult();
}
function prevSearchResult() {
  if (searchResults.length === 0) return;
  searchCurrentIdx = (searchCurrentIdx - 1 + searchResults.length) % searchResults.length;
  focusSearchResult();
}

/* ---- 右键菜单（移动、上移、下移、删除） ---- */
var _ctxFile = null; /* 右键点击的节点 file */

function showContextMenu(e, file) {
  hideContextMenu();
  _ctxFile = file;
  var menu = document.getElementById('context-menu');
  /* 构建 "移到到..." 子菜单 */
  buildMoveToSubmenu(file);
  menu.style.display = 'block';
  /* 定位 */
  var x = Math.min(e.clientX, window.innerWidth - 180);
  var y = Math.min(e.clientY, window.innerHeight - 200);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

function hideContextMenu() {
  document.getElementById('context-menu').style.display = 'none';
  _ctxFile = null;
}

function showContextTrigger() {
  var trigger = document.getElementById('ctx-trigger');
  trigger.classList.add('show');
  if (selectedNodeEl) {
    var rect = selectedNodeEl.getBoundingClientRect();
    trigger.style.left = (rect.right + 6) + 'px';
    trigger.style.top = (rect.top - 4) + 'px';
    trigger.style.right = 'auto';
    trigger.style.bottom = 'auto';
  }
}
function hideContextTrigger() {
  document.getElementById('ctx-trigger').classList.remove('show');
}

function buildMoveToSubmenu(file) {
  var sub = document.getElementById('ctx-move-sub');
  sub.innerHTML = '';
  /* 收集所有可作为父节点的候选 */
  function collectCandidates(node, candidates) {
    if (node.file && node.file !== file) {
      /* 排除自身及其子树 */
      var isDescendant = false;
      function checkDescendant(n) {
        if (n.file === file) { isDescendant = true; return true; }
        if (n.children) { return n.children.some(checkDescendant); }
        return false;
      }
      if (!checkDescendant(node)) {
        candidates.push({ file: node.file, name: node.content });
      }
    }
    if (node.children) node.children.forEach(function(c) { collectCandidates(c, candidates); });
  }
  var candidates = [];
  collectCandidates(appData.treeData, candidates);
  if (candidates.length === 0) {
    var div = document.createElement('div');
    div.className = 'ctx-item';
    div.textContent = '-';
    div.style.cursor = 'default';
    sub.appendChild(div);
    return;
  }
  candidates.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'ctx-item';
    div.textContent = c.name;
    div.addEventListener('click', function(e) {
      e.stopPropagation();
      moveNodeTo(_ctxFile, c.file);
      hideContextMenu();
    });
    sub.appendChild(div);
  });
}

function moveNodeUp(file) {
  var parent = findParentNode(appData.treeData, file);
  if (!parent || !parent.children) return;
  var idx = -1;
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].file === file) { idx = i; break; }
  }
  if (idx <= 0) return;
  var tmp = parent.children[idx];
  parent.children[idx] = parent.children[idx - 1];
  parent.children[idx - 1] = tmp;
  renderMindmap(appData.treeData);
  scheduleAutoSave();
  setTimeout(function() { trySelectNodeByFile(file, 0); }, 100);
}

function moveNodeDown(file) {
  var parent = findParentNode(appData.treeData, file);
  if (!parent || !parent.children) return;
  var idx = -1;
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].file === file) { idx = i; break; }
  }
  if (idx === -1 || idx >= parent.children.length - 1) return;
  var tmp = parent.children[idx];
  parent.children[idx] = parent.children[idx + 1];
  parent.children[idx + 1] = tmp;
  renderMindmap(appData.treeData);
  scheduleAutoSave();
  setTimeout(function() { trySelectNodeByFile(file, 0); }, 100);
}

function moveNodeTo(sourceFile, targetFile) {
  if (sourceFile === targetFile) return;
  /* 检查是否移动到自己的子树 */
  function isDescendant(parentFile, childFile) {
    var p = findNodeByFile(appData.treeData, parentFile);
    if (!p || !p.children) return false;
    for (var i = 0; i < p.children.length; i++) {
      if (p.children[i].file === childFile) return true;
      if (isDescendant(p.children[i].file, childFile)) return true;
    }
    return false;
  }
  if (isDescendant(sourceFile, targetFile)) { alert(t('cannotMoveToSelf')); return; }
  var sourceNode = findNodeByFile(appData.treeData, sourceFile);
  if (!sourceNode) return;
  var sourceParent = findParentNode(appData.treeData, sourceFile);
  if (!sourceParent) return;
  var idx = -1;
  for (var i = 0; i < sourceParent.children.length; i++) {
    if (sourceParent.children[i].file === sourceFile) { idx = i; break; }
  }
  if (idx === -1) return;
  var removed = sourceParent.children.splice(idx, 1)[0];
  var targetNode = findNodeByFile(appData.treeData, targetFile);
  if (!targetNode) return;
  if (!targetNode.children) targetNode.children = [];
  targetNode.children.push(removed);
  renderMindmap(appData.treeData);
  scheduleAutoSave();
  setTimeout(function() { trySelectNodeByFile(sourceFile, 0); }, 100);
}

/* 防抖 */
function debounce(fn, delay) {
  let timer = null;
  function wrapped() { clearTimeout(timer); timer = setTimeout(fn, delay); }
  wrapped.cancel = function() { clearTimeout(timer); timer = null; };
  return wrapped;
}

/* HTML 转义 */
function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* 生成唯一文件路径 */
function genFileId() {
  return 'node-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) + '.md';
}

/* 深拷贝 */
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* 在树中按 file 查找节点 */
function findNodeByFile(node, file) {
  if (node.file === file) return node;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = findNodeByFile(node.children[i], file);
      if (found) return found;
    }
  }
  return null;
}

/* 在树中查找父节点 */
function findParentNode(root, file) {
  if (!root.children) return null;
  for (var i = 0; i < root.children.length; i++) {
    if (root.children[i].file === file) return root;
    var found = findParentNode(root.children[i], file);
    if (found) return found;
  }
  return null;
}

/* 递归收集所有 file 路径 */
function collectFiles(node, out) {
  if (node.file) out.push(node.file);
  if (node.children) node.children.forEach(function(c) { collectFiles(c, out); });
}

/* ============================================================
   8. 菜单系统渲染与交互
   ============================================================ */
function renderMenubar() {
  var bar = document.getElementById('menubar');
  bar.innerHTML = '';
  MENU_DEFS.forEach(function(def) {
    var trigger = document.createElement('div');
    trigger.className = 'menu-trigger';
    trigger.textContent = t(def.labelKey);
    trigger.dataset.menu = def.labelKey;

    var popup = document.createElement('div');
    popup.className = 'menu-popup';
    def.items.forEach(function(item) {
      if (item === null) {
        var hr = document.createElement('div');
        hr.className = 'menu-divider';
        popup.appendChild(hr);
      } else {
        var opt = document.createElement('div');
        opt.className = 'menu-option';
        opt.dataset.action = item.action;

        var labelSpan = document.createElement('span');
        labelSpan.textContent = t(item.labelKey);
        opt.appendChild(labelSpan);

        if (item.shortcut) {
          var sc = document.createElement('span');
          sc.className = 'menu-shortcut';
          sc.textContent = item.shortcut;
          opt.appendChild(sc);
        }

        opt.addEventListener('click', function(e) {
          e.stopPropagation();
          handleAction(this.dataset.action);
          closeAllMenus();
        });

        popup.appendChild(opt);
      }
    });

    trigger.appendChild(popup);
    trigger.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = popup.classList.contains('open');
      closeAllMenus();
      if (!isOpen) {
        this.classList.add('open');
        popup.classList.add('open');
      }
    });

    bar.appendChild(trigger);
  });
}

function closeAllMenus() {
  document.querySelectorAll('.menu-trigger.open').forEach(function(el) {
    el.classList.remove('open');
  });
  document.querySelectorAll('.menu-popup.open').forEach(function(el) {
    el.classList.remove('open');
  });
}

/* 点击页面空白处关闭菜单 */
document.addEventListener('click', closeAllMenus);

      var s = document.createElement('style');

      document.head.appendChild(s);
    }
  } catch (_) {}
})();

/* 渲染/更新思维导图 */
function renderMindmap(data) {
  if (!Markmap) {
    console.error('Markmap library not loaded');
    return;
  }
  if (mm && typeof mm.setData === 'function') {
    try {
      mm.setData(deepClone(data));
      return;
    } catch (e) {
      console.warn('setData fallback', e);
    }
  }
  var el = document.getElementById('mindmap');
  el.innerHTML = '';
  mm = Markmap.create('#mindmap', MARKMAP_OPTIONS, deepClone(data));
}

/* ============================================================
   10. 右侧面板：文档加载与编辑器
   ============================================================ */

/* 自定义 fetch */
async function fetchContent(filePath) {
  if (appData.contents[filePath]) return appData.contents[filePath];
  if (EMBEDDED_FILES[filePath]) return EMBEDDED_FILES[filePath];
  var resp = await fetch(filePath);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.text();
}

/* 强制保存编辑器中的内容（切换节点时调用） */
function flushEditor() {
  if (editorFileAtOpen && editorArea.style.display !== 'none') {
    appData.contents[editorFileAtOpen] = editorTextarea.value;
    isEditorDirty = false;
    if (debouncedAutoSaveEditor && debouncedAutoSaveEditor.cancel) debouncedAutoSaveEditor.cancel();
  }
}

/* 错误显示 */
function showError(msg, onRetry) {
  var html = '<div class="error-box">'
    + '<div class="error-title">' + t('error') + '</div>'
    + '<div class="error-detail">' + escapeHtml(msg) + '</div>';
  if (onRetry) {
    html += '<button class="retry-btn" id="error-retry-btn">' + t('retry') + '</button>';
  }
  html += '</div>';
  errorArea.innerHTML = html;
  showSection(errorArea);
  var retryBtn = document.getElementById('error-retry-btn');
  if (retryBtn) retryBtn.addEventListener('click', onRetry);
}

/* 选中节点后的文档加载 */
async function loadNodeDocument(filePath) {
  showSection(loadingArea);
  try {
    var md = await fetchContent(filePath);
    /* 确保 contents 里有这份内容，后续编辑基于它 */
    if (!appData.contents[filePath]) {
      appData.contents[filePath] = md;
    }
    /* 切换到查看模式 */
    switchToViewMode(filePath);
  } catch (err) {
    showError(err.message, function() { loadNodeDocument(filePath); });
  }
}

/* 切换到查看模式 */
function switchToViewMode(filePath) {
  var md = appData.contents[filePath] || EMBEDDED_FILES[filePath] || '';
  contentArea.innerHTML = marked.parse(md);
  showSection(contentArea);
  editToggleBtn.textContent = t('edit');
  editToggleBtn.className = 'header-btn';
  editToggleBtn.style.display = '';
  editorFileAtOpen = null;
  isEditorDirty = false;
}

/* 切换到编辑模式 */
function switchToEditMode(filePath) {
  var md = appData.contents[filePath] || EMBEDDED_FILES[filePath] || '';
  editorTextarea.value = md;
  editorFileAtOpen = filePath;
  isEditorDirty = false;
  showSection(editorArea);
  editToggleBtn.textContent = t('view');
  editToggleBtn.className = 'header-btn primary';
  editorTextarea.focus();
  saveIndicator.textContent = '';
}

/* 保存编辑器内容 */
function saveEditorContent() {
  if (!editorFileAtOpen) return;
  var newMd = editorTextarea.value;
  appData.contents[editorFileAtOpen] = newMd;
  isEditorDirty = false;
  saveIndicator.textContent = t('saved');
  scheduleAutoSave();
}

/* 切换编辑/查看 */
function toggleEditMode() {
  if (!selectedFilePath) return;
  var isEditing = editorArea.style.display !== 'none';
  if (isEditing) {
    /* 当前是编辑模式 -> 保存并切换到查看 */
    saveEditorContent();
    switchToViewMode(selectedFilePath);
  } else {
    switchToEditMode(selectedFilePath);
  }
}

/* 取消编辑（放弃修改） */
function cancelEdit() {
  if (editorFileAtOpen) {
    /* 恢复到编辑器打开时的版本 */
    var orig = appData.contents[editorFileAtOpen] || EMBEDDED_FILES[editorFileAtOpen] || '';
    editorTextarea.value = orig;
  }
  isEditorDirty = false;
  switchToViewMode(editorFileAtOpen || selectedFilePath);
  saveIndicator.textContent = '';
}

/* 编辑器内容变化时标记脏 + 自动保存 */
editorTextarea.addEventListener('input', function() {
  isEditorDirty = true;
  saveIndicator.textContent = t('unsaved');
  debouncedAutoSaveEditor();
});

/* 编辑器自动保存（防抖 1.5s） */
var debouncedAutoSaveEditor = debounce(function() {
  if (!editorFileAtOpen || !isEditorDirty) return;
  saveIndicator.textContent = t('saving');
  appData.contents[editorFileAtOpen] = editorTextarea.value;
  isEditorDirty = false;
  saveIndicator.textContent = t('saved');
  scheduleAutoSave();
}, 1500);

/* ============================================================
   11. 编辑器工具栏
   ============================================================ */

/* 在 textarea 光标处插入/包裹 Markdown 语法 */
function insertMarkdown(type) {
  var ta = editorTextarea;
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var sel = ta.value.substring(start, end);
  var textBefore = ta.value.substring(0, start);
  var textAfter  = ta.value.substring(end);
  var result = '';
  var cursorPos = 0;

  switch (type) {
    case 'bold':
      result = '**' + (sel || '加粗文字') + '**';
      cursorPos = sel ? start + result.length : start + 2;
      break;
    case 'italic':
      result = '*' + (sel || '斜体文字') + '*';
      cursorPos = sel ? start + result.length : start + 1;
      break;
    case 'strike':
      result = '~~' + (sel || '删除文字') + '~~';
      cursorPos = sel ? start + result.length : start + 2;
      break;
    case 'h1':
      result = '# ' + (sel || '一级标题');
      cursorPos = start + result.length;
      break;
    case 'h2':
      result = '## ' + (sel || '二级标题');
      cursorPos = start + result.length;
      break;
    case 'h3':
      result = '### ' + (sel || '三级标题');
      cursorPos = start + result.length;
      break;
    case 'ul':
      result = (sel ? sel.split('\n').map(function(l) { return '- ' + l; }).join('\n') : '- 列表项');
      cursorPos = start + result.length;
      break;
    case 'ol':
      result = (sel ? sel.split('\n').map(function(l, i) { return (i+1) + '. ' + l; }).join('\n') : '1. 列表项');
      cursorPos = start + result.length;
      break;
    case 'code':
      result = '`' + (sel || '代码') + '`';
      cursorPos = sel ? start + result.length : start + 1;
      break;
    case 'quote':
      result = (sel ? sel.split('\n').map(function(l) { return '> ' + l; }).join('\n') : '> 引用文字');
      cursorPos = start + result.length;
      break;
    case 'link':
      result = '[' + (sel || '链接文字') + '](url)';
      cursorPos = sel ? start + result.length : start + result.indexOf('url');
      break;
    case 'hr':
      result = '\n\n---\n\n';
      cursorPos = start + result.length;
      break;
  }

  ta.value = textBefore + result + textAfter;
  ta.selectionStart = ta.selectionEnd = cursorPos;
  ta.focus();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

/* 绑定工具栏按钮点击 */
document.getElementById('editor-toolbar').addEventListener('click', function(e) {
  var btn = e.target.closest('.ed-tb-btn');
  if (!btn || !btn.dataset.md) return;
  e.preventDefault();
  insertMarkdown(btn.dataset.md);
});

/* 点击节点回调（由事件代理触发） */
function handleNodeClick(nodeData, nodeEl) {
  /* 切换节点前强制保存当前编辑器内容 + 退出内联重命名 */
  flushEditor();
  exitInlineRename();

  var raw = nodeData.data || nodeData;
  var file = raw.file;

  /* 清除旧的激活态，标记当前节点 */
  updateActiveNode(nodeEl);
  selectedNodeEl = nodeEl;
  selectedFilePath = file || null;
  showContextTrigger();

  if (!file || !file.trim()) {
    showSection(noDocArea);
    nodeTitleEl.textContent = raw.content || '未命名';
    editToggleBtn.style.display = 'none';
    return;
  }

  nodeTitleEl.textContent = raw.content || file;
  editToggleBtn.style.display = '';
  loadNodeDocument(file);

  /* 进入内联重命名模式 */
  enterInlineRename(nodeEl);
}

/* 激活态控制 */
function updateActiveNode(nodeEl) {
  document.querySelectorAll('.markmap-node[data-active]').forEach(function(el) {
    el.removeAttribute('data-active');
  });
  if (nodeEl) nodeEl.setAttribute('data-active', 'true');
}

/* --- 新建导图 --- */
function handleNew() {
  if (!confirm(t('confirmNew'))) return;
  exitInlineRename();
  var fid = genFileId();
  appData.treeData = { content: t('newProject'), file: fid };
  appData.contents = {};
  appData.contents[fid] = '# ' + t('newProject') + '\n\n' + t('editHere');
  selectedFilePath = null;
  selectedNodeEl = null;
  hideContextTrigger();
  showSection(welcomeEl);
  nodeTitleEl.textContent = '文档查看';
  editToggleBtn.style.display = 'none';
  renderMindmap(appData.treeData);
  scheduleAutoSave();
}

/* --- 保存 --- */
function handleSave() {
  if (isEditorDirty && editorFileAtOpen) {
    appData.contents[editorFileAtOpen] = editorTextarea.value;
    isEditorDirty = false;
  }
  saveIndicator.textContent = t('saving');
  doSave();
  saveIndicator.textContent = t('saved');
  setTimeout(function() {
    if (saveIndicator.textContent === t('saved')) saveIndicator.textContent = '';
  }, 2000);
}

/* ====== 构建保存用的数据对象 ====== */
function buildSavePayload() {
  return {
    version: 1,
    treeData: appData.treeData,
    contents: appData.contents,
    savedAt: new Date().toISOString()
  };
}

/* ====== 把 payload 写入 FileSystemFileHandle ====== */
function writeFileHandle(handle, payload) {
  return handle.createWritable().then(function(writable) {
    return writable.write(JSON.stringify(payload, null, 2)).then(function() {
      return writable.close();
    });
  });
}

/* ====== 解析文件内容并载入 ====== */
function loadFromParsedData(data, fileName) {
  if (!data || !data.treeData || !data.treeData.content) {
    throw new Error('无效的文件：缺少 treeData.content');
  }
  appData.treeData = data.treeData;
  appData.contents = data.contents || {};
  /* 合并嵌入内容（仅用户未修改过的） */
  Object.keys(EMBEDDED_FILES).forEach(function(k) {
    if (!appData.contents[k]) appData.contents[k] = EMBEDDED_FILES[k];
  });
  selectedFilePath = null;
  selectedNodeEl = null;
  hideContextTrigger();
  showSection(welcomeEl);
  nodeTitleEl.textContent = '文档查看';
  editToggleBtn.style.display = 'none';
  renderMindmap(appData.treeData);
  scheduleAutoSave();
}

function handleOpenFile() {

        description: '思维导图文件',
        accept: { 'application/json': ['.mdpro', '.json'] }

/* ====== 保存文件 ====== */
function handleSaveFile() {
  if (isEditorDirty && editorFileAtOpen) {
    appData.contents[editorFileAtOpen] = editorTextarea.value;
    isEditorDirty = false;
  }
  var payload = buildSavePayload();

  if (currentFileHandle) {
    /* 已有文件句柄，直接写入 */
    writeFileHandle(currentFileHandle, payload).then(function() {
      saveIndicator.textContent = t('saved');
      doSave();
      setTimeout(function() {
        if (saveIndicator.textContent === 'Saved') saveIndicator.textContent = '';
      }, 2000);
    }).catch(function() {
      handleSaveAsFile();
    });
  } else {
    handleSaveAsFile();
  }
}

/* ====== 另存为 ====== */
function handleSaveAsFile() {
  if (isEditorDirty && editorFileAtOpen) {
    appData.contents[editorFileAtOpen] = editorTextarea.value;
    isEditorDirty = false;
  }
  var payload = buildSavePayload();

  if (window.showSaveFilePicker) {
    window.showSaveFilePicker({
      types: [{
        description: '思维导图文件',
        accept: { 'application/json': ['.mdpro'] }
      }]
    }).then(function(handle) {
      currentFileHandle = handle;
      return writeFileHandle(handle, payload);
    }).then(function() {
      saveIndicator.textContent = t('saved');
      doSave();
      setTimeout(function() {
        if (saveIndicator.textContent === 'Saved') saveIndicator.textContent = '';
      }, 2000);
    }).catch(function(err) {
      if (err.name === 'AbortError' || err.name === 'SecurityError') return;
      /* 降级：直接下载 */
      fallbackDownload(payload);
    });
  } else {
    fallbackDownload(payload);
  }
}

/* ====== 降级方案：通过下载保存 ====== */

/* --- 添加子节点 --- */
function handleAddChild() {
  if (!selectedFilePath) { alert(t('selectNode')); return; }
  var parent = findNodeByFile(appData.treeData, selectedFilePath);
  if (!parent) { alert(t('nodeNotFound')); return; }
  var name = t('newNode');
  var newFile = genFileId();
  if (!parent.children) parent.children = [];
  parent.children.push({ content: name, file: newFile });
  appData.contents[newFile] = '# ' + name + '\n\n' + t('editHere');
  renderMindmap(appData.treeData);
  scheduleAutoSave();
  /* 自动选中新节点并进入重命名模式（延时等渲染） */
  setTimeout(function() { trySelectNodeByFile(newFile, 0); }, 100);
}

/* --- 添加同级节点 --- */
function handleAddSibling() {
  if (!selectedFilePath) { alert(t('selectNode')); return; }
  if (selectedFilePath === appData.treeData.file) { alert(t('noRootSibling')); return; }
  var parent = findParentNode(appData.treeData, selectedFilePath);
  if (!parent) return;
  var name = t('newNode');
  var newFile = genFileId();
  parent.children.push({ content: name, file: newFile });
  appData.contents[newFile] = '# ' + name + '\n\n' + t('editHere');
  renderMindmap(appData.treeData);
  scheduleAutoSave();
  setTimeout(function() { trySelectNodeByFile(newFile, 0); }, 100);
}

/* --- 重命名（触发内联编辑模式） --- */
function handleRename() {
  if (!selectedNodeEl) { alert(t('selectNode')); return; }
  enterInlineRename(selectedNodeEl);
}

/* --- 删除节点 --- */
function handleDelete() {
  if (!selectedFilePath) { alert(t('selectNode')); return; }
  if (selectedFilePath === appData.treeData.file) { alert(t('noDeleteRoot')); return; }
  if (!confirm(t('confirmDelete'))) return;
  var parent = findParentNode(appData.treeData, selectedFilePath);
  if (!parent) return;
  var idx = -1;
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].file === selectedFilePath) { idx = i; break; }
  }
  if (idx === -1) return;
  /* 收集要删除的文件 */
  var toRemove = [];
  collectFiles(parent.children[idx], toRemove);
  toRemove.forEach(function(f) { delete appData.contents[f]; });
  parent.children.splice(idx, 1);
  selectedFilePath = null;
  selectedNodeEl = null;
  hideContextTrigger();
  showSection(welcomeEl);
  nodeTitleEl.textContent = '文档查看';
  editToggleBtn.style.display = 'none';
  renderMindmap(appData.treeData);
  scheduleAutoSave();
}

/* ====== 内联重命名 ====== */
var inlineRenameNodeEl = null;
var inlineRenameOrigName = '';

function enterInlineRename(nodeEl) {
  if (!nodeEl) return;
  exitInlineRename();

  var contentDiv = nodeEl.querySelector('.markmap-foreign > div');
  if (!contentDiv) return;

  inlineRenameNodeEl = nodeEl;
  inlineRenameOrigName = contentDiv.textContent;

  /* 展开 foreignObject 宽度，让文本能自由扩展 */
  var fo = nodeEl.querySelector('foreignObject');
  var origWidth = null;
  if (fo) {
    origWidth = fo.getAttribute('width');
    fo.removeAttribute('width');
    fo.style.maxWidth = '800px';
    fo.style.overflow = 'visible';
  }

  contentDiv.contentEditable = 'plaintext-only';
  contentDiv.style.whiteSpace = 'nowrap';

  /* 实时跟随文本宽度 */
  contentDiv._renameInputHandler = function() {
    if (fo) {
      var w = contentDiv.scrollWidth;
      if (w > 10) {
        fo.setAttribute('width', Math.min(w + 16, 800));
      }
    }
  };
  contentDiv.addEventListener('input', contentDiv._renameInputHandler);
  /* 立即触发一次，校正当前宽度 */
  contentDiv._renameInputHandler();

  /* 失焦时自动确认重命名 */
  contentDiv._renameBlurHandler = function() {
    exitInlineRename();
  };
  contentDiv.addEventListener('blur', contentDiv._renameBlurHandler);

  contentDiv.focus();

  /* 全选文本 */
  var range = document.createRange();
  range.selectNodeContents(contentDiv);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function exitInlineRename() {
  if (!inlineRenameNodeEl) return;

  var contentDiv = inlineRenameNodeEl.querySelector('.markmap-foreign > div');
  var fo = inlineRenameNodeEl.querySelector('foreignObject');
  if (contentDiv) {
    if (contentDiv._renameBlurHandler) {
      contentDiv.removeEventListener('blur', contentDiv._renameBlurHandler);
      contentDiv._renameBlurHandler = null;
    }
    if (contentDiv._renameInputHandler) {
      contentDiv.removeEventListener('input', contentDiv._renameInputHandler);
      contentDiv._renameInputHandler = null;
    }
    contentDiv.contentEditable = 'inherit';
    contentDiv.style.whiteSpace = '';

    var newName = contentDiv.textContent.trim() || inlineRenameOrigName;
    if (newName !== inlineRenameOrigName) {
      var datum = d3.select(inlineRenameNodeEl).datum();
      var raw = datum.data || datum;
      var node = findNodeByFile(appData.treeData, raw.file);
      if (node) {
        node.content = newName;
        raw.content = newName;
        if (selectedFilePath === raw.file) {
          nodeTitleEl.textContent = newName;
        }
        /* 同步更新 MD 文档中的第一级标题 */
        if (appData.contents[raw.file]) {
          appData.contents[raw.file] = appData.contents[raw.file].replace(/^#\s+.*$/m, '# ' + newName);
          if (selectedFilePath === raw.file) {
            if (contentArea.style.display !== 'none') {
              contentArea.innerHTML = marked.parse(appData.contents[raw.file]);
            } else if (editorArea.style.display !== 'none' && editorFileAtOpen === raw.file) {
              editorTextarea.value = appData.contents[raw.file];
            }
          }
        }
        /* 重新渲染导图，让 markmap 按新名称长度重新计算布局 */
        if (mm && typeof mm.setData === 'function') {
          try { mm.setData(deepClone(appData.treeData)); } catch (_) {}
        }
        scheduleAutoSave();
      }
    }
  }

  /* 恢复 foreignObject */
  if (fo) {
    fo.style.maxWidth = '';
    fo.style.overflow = '';
  }

  inlineRenameNodeEl = null;
  inlineRenameOrigName = '';
}

function cancelInlineRename() {
  if (!inlineRenameNodeEl) return;

  var contentDiv = inlineRenameNodeEl.querySelector('.markmap-foreign > div');
  if (contentDiv) {
    if (contentDiv._renameBlurHandler) {
      contentDiv.removeEventListener('blur', contentDiv._renameBlurHandler);
      contentDiv._renameBlurHandler = null;
    }
    contentDiv.contentEditable = 'inherit';
    contentDiv.textContent = inlineRenameOrigName;
  }

  inlineRenameNodeEl = null;
  inlineRenameOrigName = '';
}

/* 尝试按 file 路径选中节点（带重试机制） */
function trySelectNodeByFile(file, attempt) {
  attempt = attempt || 0;
  if (attempt > 20) return;
  selectedFilePath = file;
  var nodeEl = findNodeElByFile(file);
  if (nodeEl) {
    selectedNodeEl = nodeEl;
    updateActiveNode(nodeEl);
    handleNodeClick({ data: findNodeByFile(appData.treeData, file) }, nodeEl);
  } else {
    setTimeout(function() { trySelectNodeByFile(file, attempt + 1); }, 150);
  }
}

/* 在 SVG 中查找对应 file 的 DOM 节点 */
function findNodeElByFile(file) {
  var el = document.getElementById('mindmap');
  var nodes = el.querySelectorAll('.markmap-node');
  for (var i = 0; i < nodes.length; i++) {
    var d = d3.select(nodes[i]).datum();
    if (d && (d.data || d).file === file) return nodes[i];
  }
  return null;
}

  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); handleNew(); }

/* ============================================================
   14. 自动保存（服务器 + localStorage 双保险）
   ============================================================ */
var STORAGE_KEY = 'mindmap-app-data';

function doSave() {
  var data = {
    treeData: appData.treeData,
    contents: appData.contents,
    savedAt: new Date().toISOString()
  };
  /* 保存到服务器 */
  try {
    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).catch(function() {});
  } catch (_) {}
  /* 同时保存到 localStorage 作为后备 */
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('localStorage save failed', e);
  }
}

var scheduleAutoSave = debounce(function() {
  doSave();
}, 2000);

/* ============================================================
   15. 初始化（同步加载 localStorage，后台异步取服务器数据）
   ============================================================ */

function init() {
  /* 0. 初始化扩展功能 */
  setLang(currentLang);
  if (darkMode) document.body.classList.add('dark');
  renderMenubar();

  /* 1. 同步：从 localStorage 加载（或使用默认数据） */
  var loaded = false;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      if (data && data.treeData && data.treeData.content) {
        appData.treeData = data.treeData;
        appData.contents = data.contents || {};
        loaded = true;
      }
    }
  } catch (_) {}

  if (!loaded) {
    appData.treeData = deepClone(DEFAULT_TREE);
    appData.contents = {};
  }

  /* 2. 合并嵌入的内容 */
  Object.keys(EMBEDDED_FILES).forEach(function(k) {
    if (!appData.contents[k]) {
      appData.contents[k] = EMBEDDED_FILES[k];
    }
  });

  /* 3. 同步渲染思维导图 */
  renderMindmap(appData.treeData);

  /* 4. 自动选中根节点 */
  (function tryAutoSelect(attempt) {
    if (attempt > 20) return;
    var firstNode = document.querySelector('.markmap-node');
    if (!firstNode) {
      setTimeout(function() { tryAutoSelect(attempt + 1); }, 150);
      return;
    }
    var datum = d3.select(firstNode).datum();
    if (datum) handleNodeClick(datum, firstNode);
  })(0);

  /* 5. 后台异步从服务器拉取较新数据，有则覆盖更新 */
  fetch('/api/data').then(function(resp) {
    if (!resp.ok) return;
    return resp.json();
  }).then(function(data) {
    if (!data || !data.treeData) return;
    /* 比较 savedAt，服务器的更新则采纳 */
    appData.treeData = data.treeData;
    appData.contents = data.contents || {};
    Object.keys(EMBEDDED_FILES).forEach(function(k) {
      if (!appData.contents[k]) appData.contents[k] = EMBEDDED_FILES[k];
    });
    renderMindmap(appData.treeData);
    /* 重新选中当前节点（如果存在） */
    if (selectedFilePath) {
      setTimeout(function() { trySelectNodeByFile(selectedFilePath); }, 200);
    } else {
      setTimeout(function() {
        var fn = document.querySelector('.markmap-node');
        if (fn) { var d = d3.select(fn).datum(); if (d) handleNodeClick(d, fn); }
      }, 200);
    }
  }).catch(function() {
    /* 服务器未启动，静默忽略 */
  });
}

init();

/* ============================================================
   14. 分隔条拖拽
   ============================================================ */
(function() {
  var splitter = document.getElementById('splitter');
  var leftPanel = document.getElementById('left-panel');
  var isDragging = false;

  splitter.addEventListener('mousedown', function(e) {
    isDragging = true;
    splitter.classList.add('active');
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var app = document.getElementById('app');
    var rect = app.getBoundingClientRect();
    var pct = ((e.clientX - rect.left) / rect.width) * 100;
    if (pct < 20) pct = 20;
    if (pct > 80) pct = 80;
    leftPanel.style.width = pct + '%';
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      splitter.classList.remove('active');
    }
  });
})();

</script>
